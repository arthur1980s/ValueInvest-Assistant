name: selftest

# 轻量自检 CI：只验证「代码可运行 + 示例可复现」，不跑任何数据依赖/联网步骤。
# 仓库只发布 runs/T-20261014 与 runs/VZ-20261014 两个示例，CI 环境没有更全的数据，
# 也不应向外取数（避免 CI 依赖网络与 SEC/行情源的可用性）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # 超时即 FAIL（防挂死），不重试
    steps:
      # Action 固定到 commit SHA（防上游 tag 被移动/篡改）：注释里保留人类可读版本号
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.11'

      # 1) 纯语法编译：不装任何第三方包，先在最小环境下暴露语法/缩进错误
      - name: 语法编译（stdlib，无需依赖）
        run: python -m py_compile datapack.py verify_run.py render_report.py tools/financial_rigor.py

      # 2) 按 requirements.txt 全文安装：验证文档化的环境在干净 runner 上可复现
      - name: 安装依赖（requirements.txt）
        run: pip install -r requirements.txt

      # 3) 渲染器自检：11 项断言（自包含 / 关键内容在位 / 缺件降级 / 三档抽取 / 结论上色）
      - name: 渲染器自检
        run: python render_report.py --selftest

      # 4) 合规门：示例运行必须判 PASS（缺结论/出处/价格区间/风控 一律非 0 退出）
      - name: 合规门（示例运行 T）
        run: python verify_run.py runs/T-20261014

      # 5) 事实包离线结构校验（不联网）
      - name: 事实包结构校验（示例运行 T）
        run: python datapack.py --verify runs/T-20261014

      # 6) 确定性计算工具可执行（第三方代码 tools/financial_rigor.py）
      - name: 确定性计算工具
        run: python tools/financial_rigor.py verify-valuation --price 44.42 --eps 3.84 --dividend 2.08

      # 7) 公开内容卫生：禁止本机环境名/家目录/私有仓库名/私有邮箱进入公开仓。
      #    为什么需要它：同一个脚本在本机与公开仓各存一份，把未脱敏的那份拷回来
      #    会静默重新引入泄漏（本地自检发现不了）。这条是纯 grep，无依赖。
      - name: 公开内容卫生扫描（无本机路径/私有邮箱）
        run: |
          if grep -rInE 'futu_env|miniconda3|/home/Tiger|~/ai-berkshire|~/\.hermes|goitex|tiger@|id_ed25519' \
               --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::发现本机路径/环境名/私有邮箱，禁止进入公开仓（逐条脱敏后再提交）"
            exit 1
          fi
          echo "✅ 未发现本机路径、环境名或私有邮箱"

      # 8) 依赖漏洞扫描（判据预注册：有已知漏洞即 FAIL；若某天因上游依赖的公开 CVE 而长期红，
      #    处理方式是升级依赖或显式 --ignore-vuln 并在提交信息写明理由，不是改成 || true）
      - name: 依赖漏洞扫描（pip-audit）
        run: |
          python -m pip install -q pip-audit
          python -m pip_audit -r requirements.txt --progress-spinner off
